# Sheriff configuration. All available keys and their defaults are in .sheriff/config.yaml.
override:
    ci.pr.max_lines_changed: 700
    phpmetrics.coupling.max_afferent: 30
    phpstan.parameters:
        haspadar:
            parameterName:
                pattern: '^(id|[a-z][a-zA-Z]{2,})$'
append:
    phpstan.parameters:
        haspadar:
            noActorSuffix:
                allowedWords:
                    - Container
                    - Docker
            afferentCoupling:
                excludedClasses:
                    - 'Goblin\GoblinException'
